        <text x="100" y="110" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">Shoppy Shop Store</text>
        <text x="100" y="127" font-size="9" fill="#1e40af" text-anchor="middle">we sell stuff, mostly shoes</text>
        <text x="14" y="171" font-size="8" font-weight="700" fill="#64748b">ProductGrid</text>
        <!-- product cards row 1 -->
        <rect x="14" y="176" width="82" height="118" rx="6" fill="#ffffff" stroke="#e5e7eb"/>
        <rect x="14" y="176" width="82" height="72" rx="6" fill="#e5e7eb"/>
        <ellipse cx="55" cy="214" rx="26" ry="10" fill="#cbd5e1"/>
        <text x="20" y="266" font-size="9" fill="#111827">Runner X</text>
        <text x="20" y="282" font-size="9" font-weight="700" fill="#111827">$89</text>
        <rect x="104" y="176" width="82" height="118" rx="6" fill="#ffffff" stroke="#e5e7eb"/>
        <rect x="104" y="176" width="82" height="72" rx="6" fill="#e5e7eb"/>
        <ellipse cx="145" cy="214" rx="26" ry="10" fill="#cbd5e1"/>
        <text x="110" y="266" font-size="9" fill="#111827">Trail Pro</text>
        <text x="110" y="282" font-size="9" font-weight="700" fill="#111827">$120</text>
        <!-- row 2, cut by the sticky bar -->
        <rect x="14" y="304" width="82" height="118" rx="6" fill="#ffffff" stroke="#e5e7eb"/>
        <rect x="14" y="304" width="82" height="72" rx="6" fill="#e5e7eb"/>
        <rect x="104" y="304" width="82" height="118" rx="6" fill="#ffffff" stroke="#e5e7eb"/>
        <rect x="104" y="304" width="82" height="72" rx="6" fill="#e5e7eb"/>
        <ellipse cx="55" cy="342" rx="26" ry="10" fill="#cbd5e1"/>
        <ellipse cx="145" cy="342" rx="26" ry="10" fill="#cbd5e1"/>
        <text x="20" y="393" font-size="9" fill="#111827">Street Lo</text>
        <text x="110" y="393" font-size="9" fill="#111827">Trail Lite</text>
