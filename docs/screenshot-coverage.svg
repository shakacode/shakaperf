  <rect x="72" y="568" width="298" height="116" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="88" y="592" class="body">Code coverage: still 100%.</text>
  <text x="88" y="612" class="body">Visual Diff: <tspan fill="#16a34a" font-weight="700">green</tspan></text>
  <text x="88" y="632" class="body">The button was never visible in the screenshot.</text>
  <text x="88" y="664" class="body bold">Nobody notices.</text>
  <g transform="translate(390,232)" class="ui">
    <rect x="0" y="0" width="200" height="400" rx="26" fill="#111827"/>
    <rect x="6" y="6" width="188" height="388" rx="21" fill="#ffffff"/>
