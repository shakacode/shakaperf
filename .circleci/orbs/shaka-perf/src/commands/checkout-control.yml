description: |
  Checkout the control commit using git worktree for control image build.
  Sets CONTROL_REPO_DIR environment variable.
  By default uses merge-base with the default branch. If PERF_BASELINE_SHA
  environment variable is set (e.g., via a prior setup step), uses that
  commit SHA instead.

parameters:
  control-dir:
    type: string
    default: '/home/circleci/control_checkout'
    description: 'Directory for control checkout'
  project-subdir:
    type: string
    default: ''
    description: 'Subdirectory within repo containing the project'
  working-directory:
    type: string
    default: '.'
    description: 'Directory containing abtests.config.ts'
  config-path:
    type: string
    default: ''
    description: 'Custom config file path (optional)'
  cli-prefix:
    type: string
    default: 'npx'
    description: 'Command prefix to invoke shaka-perf (e.g., npx, yarn, pnpm)'

steps:
  - run:
      name: Copy Docker build files to temp location
      working_directory: << parameters.working-directory >>
      command: |
        CONFIG_FLAG=""
        if [ -n "<< parameters.config-path >>" ]; then
          CONFIG_FLAG="--config << parameters.config-path >>"
        fi
        DOCKERFILE=$(<< parameters.cli-prefix >> shaka-perf servers $CONFIG_FLAG get-config dockerfile)
        DOCKERIGNORE="${DOCKERFILE}.dockerignore"
        echo "Dockerfile from config: $DOCKERFILE"
        mkdir -p /tmp/docker-build
        mkdir -p "/tmp/docker-build/$(dirname "$DOCKERFILE")"
        cp "$DOCKERFILE" "/tmp/docker-build/$DOCKERFILE"
        if [ -f "$DOCKERIGNORE" ]; then
          echo "Dockerfile ignore from config: $DOCKERIGNORE"
          mkdir -p "/tmp/docker-build/$(dirname "$DOCKERIGNORE")"
          cp "$DOCKERIGNORE" "/tmp/docker-build/$DOCKERIGNORE"
          echo "$DOCKERIGNORE" > /tmp/docker-build/.dockerignore-name
        fi
        echo "$DOCKERFILE" > /tmp/docker-build/.dockerfile-name
  - run:
      name: Checkout control commit
      command: |
        if [ -n "$PERF_BASELINE_SHA" ]; then
          CONTROL_SHA="$PERF_BASELINE_SHA"
          echo "Using baseline SHA from environment: $CONTROL_SHA"
        else
          BASE_BRANCH=$(git rev-parse --abbrev-ref origin/HEAD 2>/dev/null || echo "origin/main")
          echo "Detected base branch: $BASE_BRANCH"
          CONTROL_SHA=$(git merge-base HEAD "$BASE_BRANCH")
          echo "Using merge-base commit: $CONTROL_SHA"
        fi
        mkdir -p "<< parameters.control-dir >>"
        git worktree add "<< parameters.control-dir >>" "$CONTROL_SHA"
  - run:
      name: Restore Docker build files to control checkout
      command: |
        DOCKERFILE=$(cat /tmp/docker-build/.dockerfile-name)
        if [ -n "<< parameters.project-subdir >>" ]; then
          TARGET_DIR="<< parameters.control-dir >>/<< parameters.project-subdir >>"
        else
          TARGET_DIR="<< parameters.control-dir >>"
        fi
        mkdir -p "$TARGET_DIR/$(dirname "$DOCKERFILE")"
        cp "/tmp/docker-build/$DOCKERFILE" "$TARGET_DIR/$DOCKERFILE"
        if [ -f /tmp/docker-build/.dockerignore-name ]; then
          DOCKERIGNORE=$(cat /tmp/docker-build/.dockerignore-name)
          mkdir -p "$TARGET_DIR/$(dirname "$DOCKERIGNORE")"
          cp "/tmp/docker-build/$DOCKERIGNORE" "$TARGET_DIR/$DOCKERIGNORE"
        fi
  - run:
      name: Set CONTROL_REPO_DIR environment variable
      command: |
        if [ -n "<< parameters.project-subdir >>" ]; then
          echo "export CONTROL_REPO_DIR=<< parameters.control-dir >>/<< parameters.project-subdir >>" >> "$BASH_ENV"
        else
          echo "export CONTROL_REPO_DIR=<< parameters.control-dir >>" >> "$BASH_ENV"
        fi
