# CodeRabbit is disabled. Automatic reviews never run; nothing triggers them
# (no labels, no drafts). A one-off review can still be requested manually
# with `@coderabbitai review` on the pull request.
reviews:
  profile: chill
  high_level_summary: false
  review_status: false
  review_progress: false
  review_details: false
  collapse_walkthrough: true
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  assess_linked_issues: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  in_progress_fortune: false
  enable_prompt_for_ai_agents: false
  auto_review:
    enabled: false
    drafts: false
    auto_incremental_review: false
