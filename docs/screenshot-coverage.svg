<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="740" viewBox="0 0 1380 740" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">
  <defs>
    <style>
      .h1 { font-size: 26px; font-weight: 700; }
      .sub { font-size: 14px; fill: #475569; }
      .h2 { font-size: 18px; font-weight: 700; }
      .body { font-size: 13px; }
      .small { font-size: 11px; fill: #64748b; }
      .code { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 12px; }
      .cell { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11px; }
      .badge { font-size: 34px; font-weight: 800; }
      .panel { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; }
      .green { fill: #16a34a; }
      .red { fill: #dc2626; }
      .amber { fill: #d97706; }
      .bold { font-weight: 700; }
      .ui { font-family: -apple-system, "SF Pro Text", Inter, Helvetica, Arial, sans-serif; }
      .tag { font-size: 10px; font-weight: 700; fill: #ffffff; }
    </style>
    <marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
    <marker id="arrow-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arrow-t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bfdbfe"/>
      <stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="-2" stdDeviation="3" flood-color="#000" flood-opacity="0.18"/>
    </filter>

    <!-- ===== phone mock: 200 x 400 frame, page tail below to y=480 ===== -->
    <g id="phone" class="ui">
