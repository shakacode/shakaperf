        <rect x="104" y="404" width="82" height="18" fill="#ffffff" stroke="#e5e7eb"/>
        <text x="110" y="416" font-size="9" font-weight="700" fill="#111827">$99</text>
      </g>
      <path d="M6,436 H194 V458 a6,6 0 0 1 -6,6 H12 a6,6 0 0 1 -6,-6 Z" fill="#1e293b"/>
      <text x="16" y="453" font-size="8" fill="#94a3b8">About    Help    Returns    Contact    © Shoppy</text>

