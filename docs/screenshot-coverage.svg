        <rect x="14" y="176" width="82" height="72" rx="6" fill="#e5e7eb"/>
        <ellipse cx="55" cy="214" rx="26" ry="10" fill="#cbd5e1"/>
        <text x="20" y="266" font-size="9" fill="#111827">Runner X</text>
        <text x="20" y="282" font-size="9" font-weight="700" fill="#111827">$89</text>
        <rect x="104" y="176" width="82" height="118" rx="6" fill="#ffffff" stroke="#e5e7eb"/>
        <rect x="104" y="176" width="82" height="72" rx="6" fill="#e5e7eb"/>
        <ellipse cx="145" cy="214" rx="26" ry="10" fill="#cbd5e1"/>
        <text x="110" y="266" font-size="9" fill="#111827">Trail Pro</text>
        <text x="110" y="282" font-size="9" font-weight="700" fill="#111827">$120</text>
        <!-- row 2, cut by the sticky bar -->
        <rect x="14" y="304" width="82" height="118" rx="6" fill="#ffffff" stroke="#e5e7eb"/>
        <rect x="14" y="304" width="82" height="72" rx="6" fill="#e5e7eb"/>
