  <text x="660" y="406" class="code" xml:space="preserve" fill="#e2e8f0"><tspan fill="#94a3b8">&lt;/</tspan><tspan fill="#fbbf24">App</tspan><tspan fill="#94a3b8">&gt;</tspan></text>
