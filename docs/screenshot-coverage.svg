  <text x="660" y="330" class="code" xml:space="preserve" fill="#e2e8f0">  <tspan fill="#94a3b8">&lt;</tspan><tspan fill="#86efac">Header</tspan><tspan fill="#94a3b8"> /&gt;</tspan></text>
  <text x="806" y="330" class="cell" fill="#86efac">100%</text>
