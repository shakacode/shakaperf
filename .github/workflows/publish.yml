name: Publish Package

on:
  push:
    tags:
      - '*@*' # Matches: package-name@version

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Extract package info from tag
        id: package
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          PACKAGE_NAME=${TAG%@*}
          VERSION=${TAG#*@}
          echo "name=$PACKAGE_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing $PACKAGE_NAME version $VERSION"

      - name: Check published install hooks before install
        run: node security-checks/check-install-scripts.mjs

      - name: Install dependencies
        run: yarn install --immutable

      - name: Verify dependency locks were not rewritten
        run: git diff --exit-code -- yarn.lock packages/shaka-perf/npm-shrinkwrap.json

      # A tag push skips CI, so this is the last gate before the tarball is public.
      - name: Check supply chain
        # Only shaka-perf ships npm-shrinkwrap.json, and it can only name a
        # shaka-shared version that is already on npm — so this gate cannot
        # run on the shaka-shared tag that publishes it. Install hooks are
        # still checked for every tag by the step above.
        if: steps.package.outputs.name == 'shaka-perf'
        run: yarn security-checks

      - name: Build shaka-shared
        run: yarn workspace shaka-shared run build

      - name: Build package
        run: yarn workspace ${{ steps.package.outputs.name }} run build

      - name: Publish package
        run: yarn workspace ${{ steps.package.outputs.name }} npm publish --access public
