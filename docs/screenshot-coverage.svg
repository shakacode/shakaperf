  <text x="72" y="199" class="cell" style="font-size:14px" xml:space="preserve" fill="#334155">/goal Write tests until you reach 100% line coverage</text>
  <rect x="72" y="436" width="298" height="34" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
