        <rect x="16" y="358" width="60" height="20" rx="4" fill="#111827"/>
        <text x="46" y="371" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle">Accept</text>
        <text x="86" y="371" font-size="8" fill="#4b5563" text-decoration="underline">Manage</text>
        <!-- home indicator -->
        <rect x="76" y="386" width="48" height="4" rx="2" fill="#111827"/>
