<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{SIDE_LABEL}} console</title>
<!--
  Console "screenshot" for shaka-perf-find-bugs. Renders one command and its
  output as a terminal window, so a console reproduction can be screenshotted
  like a web page and used in the report's screenshot slots. Make one copy per
  side: same command, control and experiment.

  Fill in:
  - {{SIDE_LABEL}}: the branch name of this side.
  - {{COMMAND}}: the command exactly as run, without the shaka-perf wrapper.
  - {{OUTPUT}}: the raw output. ANSI colors are rendered; other escape codes
    are dropped. Paste it unchanged, except write any "</script" as "<\/script".
    A line a program redrew in place (a progress bar) shows once per redraw:
    keep only its last version.

  Open it in the browser at a 390x620 viewport, the size of a report
  screenshot slot, and take a full-page screenshot; the window fills the
  slot and long lines wrap. For wide output, use a wider viewport (and widen
  the report's shots to match). Crop in the report with the img height and
  margin-top, as with browser shots.
-->
<style>
  html, body { margin: 0; background: #0d1117; }
  .window { min-height: 100vh; background: #0d1117; }
  .bar { display: flex; align-items: center; gap: 7px; padding: 9px 12px; background: #21262d; }
  .bar i { width: 11px; height: 11px; border-radius: 50%; background: #ff5f57; }
  .bar i:nth-child(2) { background: #febc2e; } .bar i:nth-child(3) { background: #28c840; }
  .bar b { flex: 1; margin-right: 47px; overflow: hidden; color: #8b949e; font: 600 12px/1.3 ui-monospace, Menlo, Consolas, monospace; text-align: center; text-overflow: ellipsis; white-space: nowrap; }
  pre { margin: 0; padding: 12px 14px 16px; color: #e6edf3; font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
  .prompt { color: #7ee787; }
  .b { font-weight: 700; } .d { opacity: .65; } .it { font-style: italic; } .u { text-decoration: underline; }
</style>
</head>
<body>
<div class="window">
  <div class="bar"><i></i><i></i><i></i><b>{{SIDE_LABEL}}</b></div>
  <pre id="screen"></pre>
</div>
<script type="text/plain" id="command">{{COMMAND}}</script>
<script type="text/plain" id="output">{{OUTPUT}}</script>
<script>
  // Standard xterm colors 0-15, then the 6x6x6 cube and the gray ramp for 16-255.
  const BASE = ['#484f58', '#ff7b72', '#3fb950', '#d29922', '#58a6ff', '#bc8cff', '#39c5cf', '#b1bac4',
    '#6e7681', '#ffa198', '#56d364', '#e3b341', '#79c0ff', '#d2a8ff', '#56d4dd', '#ffffff'];
  function color256(n) {
    if (n < 16) return BASE[n];
    if (n >= 232) { const v = 8 + (n - 232) * 10; return `rgb(${v},${v},${v})`; }
    const i = n - 16, c = (x) => (x ? 55 + x * 40 : 0);
    return `rgb(${c(Math.floor(i / 36))},${c(Math.floor(i / 6) % 6)},${c(i % 6)})`;
  }
  const raw = (id) => document.getElementById(id).textContent.replace(/^\n/, '').replace(/\s+$/, '').replace(/<\\\//g, '</');

  function render(pre, text) {
    let style = {};
    const span = (chunk) => {
      if (!chunk) return;
      const el = document.createElement('span');
      el.textContent = chunk;
      el.className = [style.b && 'b', style.d && 'd', style.it && 'it', style.u && 'u'].filter(Boolean).join(' ');
      if (style.fg) el.style.color = style.fg;
      if (style.bg) el.style.background = style.bg;
      pre.appendChild(el);
    };
    // Keep color (SGR) codes; drop every other escape sequence.
    const clean = text.replace(/\x1b\[[0-9;?]*[A-Za-ln-z]|\x1b\][^\x07]*\x07|\x1b[()][A-Z0-9]/g, '');
    const re = /\x1b\[([0-9;]*)m/g;
    let last = 0, m;
    while ((m = re.exec(clean))) {
      span(clean.slice(last, m.index));
      last = re.lastIndex;
      const codes = (m[1] || '0').split(';').map(Number);
      for (let i = 0; i < codes.length; i++) {
        const c = codes[i];
        if (c === 0) style = {};
        else if (c === 1) style.b = true; else if (c === 2) style.d = true;
        else if (c === 3) style.it = true; else if (c === 4) style.u = true;
        else if (c === 22) style.b = style.d = false; else if (c === 23) style.it = false; else if (c === 24) style.u = false;
        else if (c >= 30 && c <= 37) style.fg = BASE[c - 30]; else if (c >= 90 && c <= 97) style.fg = BASE[c - 82];
        else if (c >= 40 && c <= 47) style.bg = BASE[c - 40]; else if (c >= 100 && c <= 107) style.bg = BASE[c - 92];
        else if (c === 39) style.fg = null; else if (c === 49) style.bg = null;
        else if (c === 38 || c === 48) {
          const key = c === 38 ? 'fg' : 'bg';
          if (codes[i + 1] === 5) { style[key] = color256(codes[i + 2]); i += 2; }
          else if (codes[i + 1] === 2) { style[key] = `rgb(${codes[i + 2]},${codes[i + 3]},${codes[i + 4]})`; i += 4; }
        }
      }
    }
    span(clean.slice(last));
  }

  const screen = document.getElementById('screen');
  const prompt = document.createElement('span');
  prompt.className = 'prompt';
  prompt.textContent = '$ ';
  screen.append(prompt, raw('command'), '\n');
  render(screen, raw('output'));
</script>
</body>
</html>
