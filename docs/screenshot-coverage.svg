      <rect x="162" y="15" width="12" height="5" rx="1" fill="#111827"/>
      <text x="100" y="186" font-size="13" font-weight="800" text-anchor="middle" fill="#64748b">WHO CARES WHAT</text>
      <text x="100" y="204" font-size="13" font-weight="800" text-anchor="middle" fill="#64748b">IS ON THE SCREEN?</text>
      <text x="100" y="232" font-size="13" font-weight="800" text-anchor="middle" fill="#16a34a">WE HAVE 100%</text>
      <text x="100" y="250" font-size="13" font-weight="800" text-anchor="middle" fill="#16a34a">CODE COVERAGE!</text>
      <rect x="76" y="386" width="48" height="4" rx="2" fill="#111827"/>
