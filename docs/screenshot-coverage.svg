    <rect x="32" y="374" width="272" height="34" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="44" y="396" class="body bold green">Goal achieved! <tspan fill="#dc2626">(prematurely)</tspan></text>
    <rect x="32" y="418" width="272" height="34" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <text x="44" y="440" class="body bold red">Someone breaks styles in &lt;CartButton/&gt;</text>
    <rect x="32" y="462" width="272" height="116" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <text x="44" y="486" class="body">Code coverage: still 100%.</text>
    <text x="44" y="506" class="body">Visual Diff: <tspan fill="#16a34a" font-weight="700">green</tspan></text>
    <text x="44" y="526" class="body">The button was never visible</text>
    <text x="44" y="546" class="body">in the screenshot.</text>
    <text x="44" y="568" class="body bold">Nobody notices.</text>

    <path d="M22,330 L22,578" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow-t)"/>
    <text transform="translate(25,454) rotate(-90)" text-anchor="middle" style="font-size:10px;font-weight:700;paint-order:stroke;stroke:#f8fafc;stroke-width:4px" fill="#64748b">TIME</text>

