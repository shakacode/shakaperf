        <rect x="16" y="37" width="14" height="2" fill="#111827"/>
        <rect x="16" y="42" width="14" height="2" fill="#111827"/>
        <rect x="16" y="47" width="14" height="2" fill="#111827"/>
        <text x="184" y="47" font-size="10" font-weight="800" text-anchor="end">Logo</text>
