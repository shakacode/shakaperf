name: Pest Control

# Removes AI review-bot comments from pull requests.
#
# - guard: fires on every new PR comment (timeline or inline) and deletes it
#   immediately when the author is one of the bots below.
# - sweep: manual run of scripts/pest-control.sh over existing PRs.
#
# Both use the built-in GITHUB_TOKEN; deletions show as github-actions[bot].

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Log matches without deleting
        type: boolean
        default: false
      state:
        description: Which PRs to sweep (open, closed, all)
        type: string
        default: all
      limit:
        description: Max PRs to sweep
        type: string
        default: '500'

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  guard:
    if: >-
      github.event_name != 'workflow_dispatch' &&
      (github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request != null) &&
      contains(fromJSON('["claude[bot]","coderabbitai[bot]","greptile-apps[bot]"]'), github.event.comment.user.login)
    runs-on: ubuntu-latest
    steps:
      - name: Delete the bot comment
        env:
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_LOGIN: ${{ github.event.comment.user.login }}
          COMMENT_CREATED: ${{ github.event.comment.created_at }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          IS_INLINE: ${{ github.event_name == 'pull_request_review_comment' }}
        run: |
          set -euo pipefail
          if [ "$IS_INLINE" = true ]; then
            endpoint="repos/$GH_REPO/pulls/comments/$COMMENT_ID"
          else
            endpoint="repos/$GH_REPO/issues/comments/$COMMENT_ID"
          fi
          gh api -X DELETE "$endpoint" >/dev/null
          echo "deleted [$COMMENT_LOGIN] $COMMENT_CREATED $COMMENT_URL"
          printf '%s\n' "$COMMENT_BODY" | sed 's/^/    | /'

  sweep:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Sweep existing pull requests
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          STATE: ${{ inputs.state }}
          LIMIT: ${{ inputs.limit }}
        run: |
          set -euo pipefail
          args=(--state "$STATE" --limit "$LIMIT")
          [ "$DRY_RUN" = true ] && args+=(--dry-run)
          scripts/pest-control.sh "${args[@]}"
