    <text x="30" y="167" class="code" xml:space="preserve" fill="#e2e8f0">  <tspan fill="#94a3b8">&lt;</tspan><tspan fill="#86efac">NavBar</tspan><tspan fill="#94a3b8">&gt;</tspan></text>
    <text x="162" y="167" class="cell" fill="#86efac">100%</text>
    <text x="30" y="186" class="code" xml:space="preserve" fill="#e2e8f0">    <tspan fill="#94a3b8">&lt;</tspan><tspan fill="#86efac">Logo</tspan><tspan fill="#94a3b8"> /&gt;</tspan></text>
    <text x="162" y="186" class="cell" fill="#86efac">100%</text>
    <text x="30" y="205" class="code" xml:space="preserve" fill="#e2e8f0">  <tspan fill="#94a3b8">&lt;/</tspan><tspan fill="#86efac">NavBar</tspan><tspan fill="#94a3b8">&gt;</tspan></text>
    <text x="30" y="224" class="code" xml:space="preserve" fill="#e2e8f0">  <tspan fill="#94a3b8">&lt;</tspan><tspan fill="#86efac">Header</tspan><tspan fill="#94a3b8"> /&gt;</tspan></text>
    <text x="162" y="224" class="cell" fill="#86efac">100%</text>
    <text x="30" y="243" class="code" xml:space="preserve" fill="#e2e8f0">  <tspan fill="#94a3b8">&lt;</tspan><tspan fill="#fbbf24">ProductGrid</tspan><tspan fill="#94a3b8"> /&gt;</tspan></text>
    <text x="162" y="243" class="cell" fill="#fbbf24">54%  banner + fold</text>
    <text x="30" y="262" class="code" xml:space="preserve" fill="#e2e8f0">  <tspan fill="#94a3b8">&lt;</tspan><tspan fill="#f87171">CartButton</tspan><tspan fill="#94a3b8"> /&gt;</tspan></text>
    <text x="162" y="262" class="cell" fill="#f87171">0%  cookie banner on top</text>
    <text x="30" y="281" class="code" xml:space="preserve" fill="#e2e8f0">  <tspan fill="#94a3b8">&lt;</tspan><tspan fill="#f87171">Footer</tspan><tspan fill="#94a3b8"> /&gt;</tspan></text>
    <text x="162" y="281" class="cell" fill="#f87171">0%  below the fold</text>
    <text x="30" y="300" class="code" xml:space="preserve" fill="#e2e8f0"><tspan fill="#94a3b8">&lt;/</tspan><tspan fill="#fbbf24">App</tspan><tspan fill="#94a3b8">&gt;</tspan></text>

    <rect x="32" y="330" width="294" height="34" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <text x="44" y="352" class="body bold red">Incomplete coverage! More tests needed.</text>
    <rect x="32" y="374" width="294" height="34" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="44" y="396" class="body bold green">AI keeps adding tests</text>
    <rect x="32" y="418" width="294" height="34" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <text x="44" y="440" class="body bold red">Someone breaks styles in &lt;CartButton/&gt;</text>
